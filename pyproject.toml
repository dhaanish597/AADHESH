[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aadesh"
version = "0.1.0"
description = "Environmental compliance execution system for Delhi-NCR construction sites under GRAP"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }

dependencies = [
    # Real Cedar 4.x engine (Rust) via native Python bindings.
    # Pinned: the authorization boundary must not drift under us mid-hackathon.
    "cedarpy==4.12.1",
    # Corpus schema validation. A corpus entry that does not validate cannot be loaded.
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    # Ingestion tests exercise the REAL pypdf extraction path rather than mocking it.
    "pypdf>=5",
]
# Opt-in only. The default test path must never require Docker or AWS.
aws = [
    "boto3>=1.35",
]
# Needed only to ADD a source document (`aadesh-corpus ingest`). `make verify` re-reads the
# committed pN.txt files and must keep working without this installed.
ingest = [
    "pypdf>=5",
]

[project.scripts]
aadesh-verify = "aadesh_cli.verify:main"
aadesh-corpus = "aadesh_cli.corpus:main"
aadesh-parchi = "aadesh_cli.parchi:main"

[tool.hatch.build.targets.wheel]
packages = [
    "services/aadesh_core",
    "services/aadesh_adapters",
    "services/aadesh_cli",
]

[tool.pytest.ini_options]
# services/ is on the path so `aadesh_core` imports without an install step.
pythonpath = ["services"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires LocalStack or Docker (excluded from the default run)",
    "requires_index: requires a running OpenSearch (excluded from the default run)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
